# Render Blueprint: コネクティングドット事務所 LINEボット（無料プラン）
services:
  - type: web
    name: connecting-dots-line-bot
    runtime: node
    plan: free
    rootDir: line-bot
    branch: claude/line-bot-connecting-dots
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_USER_ID
        value: U07eff7d5cd4929153a1ec149c0a9a8a0
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: DELIVERY_FILES
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
